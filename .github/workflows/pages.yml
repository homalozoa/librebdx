name: Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # The film cuts are large, so they live on the release page rather than in git.
      - name: Fetch the film cuts from the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --pattern 'bdx_a_new_gait_en_web.mp4' --output site/media/film_en.mp4
          gh release download --pattern 'bdx_a_new_gait_zh_web.mp4' --output site/media/film_zh.mp4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
