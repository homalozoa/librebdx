[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdx-new-gait"
version = "1.1.0"
description = "Unofficial reproduction of 'Design and Control of a Bipedal Robotic Character' (Grandia et al., RSS 2024) in mjlab / MuJoCo Warp"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
# Versions used for every result in docs/REPORT.md.
dependencies = [
  "mjlab==1.6.0",
  "rsl-rl-lib==5.4.2",
  "mujoco==3.11.0",
  "mujoco-warp==3.11.0",
  "warp-lang==1.18.0",
  "torch==2.7.1",
  "numpy>=2.2",
  "scipy>=1.15",
  "proxsuite>=0.7",
  "matplotlib>=3.10",
  "mediapy>=1.2",
  "tensorboard>=2.21",
]

[project.urls]
Paper = "https://www.roboticsproceedings.org/rss20/p103.html"
arXiv = "https://arxiv.org/abs/2501.05204"

[tool.setuptools.packages.find]
include = ["disneyrepro*"]

[tool.setuptools.package-data]
disneyrepro = ["**/*.xml", "**/*.stl", "**/*.npz", "**/*.pt", "**/LICENSE*"]

[tool.ruff]
line-length = 120
indent-width = 2

[tool.ruff.lint]
# CI gate: syntax errors and undefined names only; style is left to the surrounding code.
select = ["E9", "F63", "F7", "F82"]
